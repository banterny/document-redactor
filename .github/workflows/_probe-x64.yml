##
# TEMPORARY diagnostic workflow. Delete once the x64 question is settled.
#
# Two rules (entities.ko-phone-context, entities.uk-inquest-context) breach the
# in-process 50ms smoke budget on GitHub's x64 runners at 160-196ms, while
# measuring 0.00-0.21ms locally on arm64 at the same node major version. This
# job measures every rule on the runner itself so the x64 picture is data
# rather than inference.
#
# The registry is TypeScript, and node cannot resolve its .js -> .ts imports,
# so bun dumps the patterns to JSON and node does the measuring. That split
# matters: bun is JavaScriptCore, and the question here is about V8.
##
name: _probe x64

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Dump rule patterns with bun
        run: |
          cat > ./_dump.ts <<'EOF'
          import { ALL_REGEX_RULES } from "./src/detection/_framework/registry.ts";
          console.log(JSON.stringify(
            ALL_REGEX_RULES.map((r) => ({ id: r.id, source: r.pattern.source, flags: r.pattern.flags })),
          ));
          EOF
          bun ./_dump.ts > /tmp/rules.json
          echo "dumped $(node -p "JSON.parse(require('fs').readFileSync('/tmp/rules.json','utf8')).length") rules"

      - name: Measure every rule under node/V8 on this runner
        run: |
          cat > /tmp/probe.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          const RULES = JSON.parse(readFileSync("/tmp/rules.json", "utf8"));
          const INPUTS = {
            '"a".repeat(10_000)': "a".repeat(10000),
            '"1".repeat(10_000)': "1".repeat(10000),
            '"a-".repeat(5_000)': "a-".repeat(5000),
            '" ".repeat(10_000)': " ".repeat(10000),
          };
          const WARM = 3, MEAS = 5;   // the smoke gate's own settings
          const has = typeof process.threadCpuUsage === "function";
          const now = () => {
            if (has) { const t = process.threadCpuUsage(); return (t.user + t.system) / 1000; }
            return performance.now();
          };
          const scan = (re, input) => { re.lastIndex = 0; let c = 0; while (re.exec(input) !== null && c < 1000) c++; };
          function bench(source, flags, input) {
            const re = new RegExp(source, flags);
            for (let i = 0; i < WARM; i++) scan(re, input);
            const s = now();
            for (let i = 0; i < MEAS; i++) scan(re, input);
            return (now() - s) / MEAS;
          }
          console.log(`arch=${process.arch} platform=${process.platform} node=${process.version} v8=${process.versions.v8} threadCpuUsage=${has}`);
          console.log(`cpu=${(await import("node:os")).cpus()[0].model}`);
          const rows = [];
          for (const r of RULES)
            for (const [iname, input] of Object.entries(INPUTS))
              rows.push({ id: r.id, iname, ms: bench(r.source, r.flags, input) });
          rows.sort((a, b) => b.ms - a.ms);
          console.log("\nWORST 12 (budget 50ms):");
          for (const w of rows.slice(0, 12))
            console.log(`  ${w.ms >= 50 ? "OVER " : "     "}${w.id.padEnd(32)} ${w.iname.padEnd(22)} ${w.ms.toFixed(2).padStart(9)}ms`);
          const over = rows.filter((r) => r.ms >= 50);
          console.log(`\n${over.length} of ${rows.length} rule x input combinations over budget`);
          console.log("\nCONTROLS — same guard technique, for comparison:");
          for (const id of ["entities.ko-identity-context","financial.amount-context-ko","identifiers.uk-gmc","legal.uk-legal-context"])
            for (const [iname] of Object.entries(INPUTS).filter(([n]) => n.includes('" "')))
              console.log(`  ${id.padEnd(32)} ${iname.padEnd(22)} ${(rows.find((r) => r.id === id && r.iname === iname)?.ms ?? NaN).toFixed(2).padStart(9)}ms`);
          EOF
          node /tmp/probe.mjs
